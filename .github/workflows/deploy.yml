name: Build NAVs and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # AMFI publishes NAVs in the evening IST; 18:30 UTC = midnight IST, Mon–Sat.
    - cron: "30 18 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build navs.json from AMFI
        run: python scripts/build_navs.py site/navs.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
